name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please fill out the form below.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: Describe the problem you're trying to solve or the motivation for this feature.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or solution you'd like.
      placeholder: It would be great if shots could...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds you've considered.
      placeholder: I've tried using X, but...

  - type: textarea
    id: example
    attributes:
      label: Example Usage
      description: Show how the feature would be used (CLI commands, config examples, etc.)
      placeholder: |
        shots run-config --config shots.yaml --new-feature
      render: shell

  - type: dropdown
    id: scope
    attributes:
      label: Feature Scope
      description: What area does this feature affect?
      options:
        - CLI / Commands
        - Configuration
        - LLM Integration
        - Viewport / Screenshot
        - Image Processing
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Would you be willing to contribute this feature?
      options:
        - label: I would be willing to submit a PR for this feature
