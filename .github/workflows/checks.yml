name: Checks

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: checks-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: '3.12'
      - name: Ruff lint
        run: uv run --all-extras ruff check .
      - name: Ruff format check
        run: uv run --all-extras ruff format --check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: '3.12'
      - name: mypy
        run: uv run --all-extras mypy shots --ignore-missing-imports

  # Single job (not a matrix) so it reports as one stable check named "test" —
  # runs both supported Python versions as steps.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Test on Python 3.12 (with coverage)
        run: uv run --python 3.12 --all-extras pytest --cov=shots --cov-report=term-missing --cov-report=xml
      - name: Test on Python 3.13
        run: uv run --python 3.13 --all-extras pytest
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
