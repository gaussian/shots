[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[project]
name = "shots"
version = "0.1.0"
description = "LLM-assisted high-res marketing screenshots for SaaS apps (generic login via Playwright storage_state)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.40.0",
  "pillow>=10.0.0",
]

[project.optional-dependencies]
llm = [
  "openai>=1.0.0",
]
yaml = [
  "pyyaml>=6.0.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=4.1.0",
  "pytest-mock>=3.12.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "pre-commit>=4.0.0",
  "types-Pillow>=10.0.0",
  "types-PyYAML>=6.0.0",
]

[project.scripts]
shots = "shots.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["shots"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = [
  "E501",    # line too long (handled by formatter)
  "SIM102",  # nested if (sometimes more readable)
  "SIM105",  # contextlib.suppress (explicit try/except clearer)
  "RUF046",  # unnecessary int() call (explicit is fine)
]

[tool.ruff.lint.per-file-ignores]
"shots/*" = ["RUF059"]  # unused unpacked variable OK in source

[tool.ruff.lint.isort]
known-first-party = ["shots"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_ignores = false
ignore_missing_imports = true
disable_error_code = ["assignment", "arg-type"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-v", "--tb=short"]
markers = [
  "unit: Unit tests",
  "integration: Integration tests",
  "slow: Slow tests",
]

[tool.coverage.run]
source = ["shots"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
fail_under = 70
