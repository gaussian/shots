[project]
name = "shots"
version = "0.1.0"
description = "LLM-assisted high-res marketing screenshots for SaaS apps (generic login via Playwright storage_state)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.40.0",
  "pillow>=10.0.0",
]

[project.optional-dependencies]
llm = [
  "openai>=1.0.0",
]
yaml = [
  "pyyaml>=6.0.0",
]

[project.scripts]
shots = "shots.cli:main"
